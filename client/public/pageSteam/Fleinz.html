
<!-- récuperé de la page steam officiel -->

<!DOCTYPE html>
<html class=" responsive DesktopUI" lang="fr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" href="main.css">
</head>
<body class="flat_page profile_page has_profile_background CosmicTheme responsive_page " style="min-height: auto;">
    <div role="main" class="responsive_page_template_content" id="responsive_page_template_content" data-panel="{&quot;autoFocus&quot;:true,&quot;navKey&quot;:&quot;responsive_page_template_content&quot;}">

            <div class="profile_animated_background">
                <video playsinline autoplay muted loop poster="./res/fondFleinz.jpg">
                    <source src="./res/fondFleinz.mp4" type="video/mp4">
                </video>
            </div>

            <div class="profile_header_bg">

                <div class="profile_header_bg_texture">

                    <div class="profile_header" style="padding-bottom: 5px;">

                        <div class="profile_header_content" data-panel="{&quot;flow-children&quot;:&quot;row&quot;}">

                            <div class="playerAvatar profile_header_size online" data-miniprofile="394294629">
                                <div class="playerAvatarAutoSizeInner">
                                    <div class="profile_avatar_frame">
                                        <picture>
                                            </source>
                                            <img src="./res/cadreFleinz.png">
                                        </picture>
                                    </div>
                                    <picture>
                                        <img srcset="./res/ppFleinz.jpg">
                                    </picture>
                                </div>
                            </div>

                            <div class="profile_header_centered_col">
                                <div class="profile_header_centered_persona">
                                    <div class="persona_name" style="font-size: 24px;">
                                        <span class="actual_persona_name">NyansFleinz</span>
                                    </div>
                                    <div class="header_real_name ellipsis">
                                        <img class="profile_flag" src="./res/fr.gif">
                                        France
                                    </div>
                                </div>
                                <div class="profile_header_summary desktop">
                                    <div class="profile_summary">
										<img src="./res/happystar2022.png" alt=":happystar2022:" class="emoticon">
                                        Playin CS2
                                        <img src="./res/bq1.png" alt=":bq1:" class="emoticon">
                                        <img src="./res/bq2.png" alt=":bq2:" class="emoticon">
                                        <img src="./res/bq4.png" alt=":bq4:" class="emoticon">
                                        <br>
                                        <img src="./res/steamhappy.png" alt=":steamhappy:" class="emoticon">
                                        HAIIII
                                        <br>
                                        <img src="./res/csgocross.png" alt=":csgocross:" class="emoticon">
                                        Pro gaming aim (i try)
                                        <br>
                                        <img src="./res/steamthis.png" alt=":steamthis:" class="emoticon">	
                                        13k elo		
                                    </div>
                                </div>
                            </div>
                            <div class="profile_header_badgeinfo" data-panel="{&quot;flow-children&quot;:&quot;column&quot;}">
                                <div class="profile_header_badgeinfo_badge_area">
                                    <a data-panel="{&quot;focusable&quot;:true,&quot;clickOnActivate&quot;:true}" role="button" class="persona_level_btn">
                                        <div class="persona_name persona_level">
                                            Niveau 
                                            <div class="friendPlayerLevel lvl_10">
                                                <span class="friendPlayerLevelNum">22</span>
                                            </div>
                                        </div>
                                    </a>
                                    <div class="profile_header_badge">
                                        <a class="favorite_badge">
                                            <div class="favorite_badge_icon" data-tooltip-html="Shark iron coin>
                                            Badge Changed - Niveau 2">
                                                <img src="./res/badgeFleinz.png" class="badge_icon small">
                                            </div>
                                            <div class="favorite_badge_description">
                                                <div class="name ellipsis">Global Sentinel</div>
                                                <div class="xp">500 XP</div>
                                            </div>
                                        </a>
                                    </div>
                                </div>

                                <div class="realSteam">
                                    <a href="https://steamcommunity.com/id/nsKrystal/" target="_blank">vrai page steam</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="profile_content has_profile_background" style="min-height: 0 !important">
                <div class="profile_content_inner" style="padding-bottom:0% !important">

                    <div class="profile_leftcol">

                        <div class="profile_customization_area">

                            <div data-panel="{&quot;type&quot;:&quot;PanelGroup&quot;}" class="profile_customization">
                                <div class="profile_customization_header">Jeu favori	</div>
                                <div class="profile_customization_block">
                                    <div class="favoritegame_showcase">
                                        <div class="showcase_content_bg">
                                            <div class="favoritegame_showcase_game showcase_slot ">
                                                <div class="favorite_game_cap ">
                                                    <a>
                                                        <img class="game_capsule" src="./res/counterStrike.jpg">
                                                    </a>
                                                </div>
                                                <div class="showcase_item_detail_title">
                                                    <a class="whiteLink">Counter-Strike 2	</a>
                                                </div>
                                            </div>
                                            <div class="showcase_stats_row">
                                                <div class="showcase_stat">
                                                    <div class="value">1 279</div>
                                                    <div class="label">Heures de jeu</div>
                                                </div>
                                                <div class="showcase_stat">
                                                    <div class="value">1</div>
                                                    <div class="label">Succès</div>
                                                </div>
                                                <div style="clear: left;"></div>
                                            </div>
                                        </div>

                                        <div class="game_info_stats">
                                            <div class="game_info_achievements_only_ctn">
                                                <div class="game_info_achievements">
                                                    <div class="game_info_achievements_summary_area">
                                                        <span class="game_info_achievement_summary">
                                                            <a class="whiteLink">Progression des succès</a>
                                                        &nbsp; 
                                                            <span class="ellipsis">1 sur 1</span>
                                                        </span>
                                                        <div class="achievement_progress_bar_ctn">
                                                            <div class="progress_bar" style="width: 98%;">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="achievement_icons">
                                                        <div class="game_info_achievement" data-tooltip-text="Un nouveau départ">
                                                                <img src="https://cdn.akamai.steamstatic.com/steamcommunity/public/images/apps/730/f75dd04fa12445a8ec43be65fa16ff1b8d2bf82e.jpg">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div style="clear: both;"></div>
                                            </div>
                                        </div>
                                    </div>

                            </div>
                        </div>
                    </div>
</body>
</html>
